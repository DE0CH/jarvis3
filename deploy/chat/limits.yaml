# Defaults for a container that sets no resources, and a ceiling no single container may pass.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: jarvis
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi, ephemeral-storage: 64Mi}
      default: {memory: 256Mi, ephemeral-storage: 1Gi}
      max: {memory: 4Gi, ephemeral-storage: 16Gi}
