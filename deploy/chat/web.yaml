# web (docs/CHAT.md, "Control plane"): the sandbox manager the instance's UI pods call (/internal/cc/*), its janitor
# and, with provider vm, the scaler. Zero-downtime: on SIGTERM readiness turns 503 (the Service stops sending it calls),
# the calls in flight (a sandbox start takes up to 3 minutes) get JARVIS_DRAIN_SECONDS (300) < the 330 s grace period;
# the janitor and the scaler move to the other replica (advisory locks).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: jarvis
# Sandbox pods (provider kubernetes) are created by the instance's own Role in the sandbox namespace (or in a separate
# sandbox cluster with the token in Secret `sandbox-cluster`).
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: jarvis
  labels: {app: web}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: web}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: web}
    spec:
      serviceAccountName: web
      automountServiceAccountToken: true
      enableServiceLinks: false
      priorityClassName: serving
      terminationGracePeriodSeconds: 330
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: jarvis3-chat
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: JARVIS_ROLE, value: web}
            - {name: PORT, value: "8080"}
            - name: JARVIS_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: JARVIS_DRAIN_SECONDS, value: "300"}
            # the sandbox cluster's API server URL, CA and a token for its jarvis-sandbox namespace (Secret
            # `sandbox-cluster`, keys server, ca.crt, token; optional until the sandbox cluster exists)
            - {name: JARVIS_SANDBOX_CLUSTER_DIR, value: /var/run/secrets/jarvis/sandbox-cluster}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: web-env, key: DATABASE_URL}}
            # the bearer token the UI pods send on /internal/cc/*
            - name: JARVIS_CC_TOKEN
              valueFrom: {secretKeyRef: {name: web-env, key: JARVIS_CC_TOKEN}}
            # sandbox provider e2b (config sandbox.provider): the instance's E2B API key
            - name: E2B_API_KEY
              valueFrom: {secretKeyRef: {name: web-env, key: E2B_API_KEY, optional: true}}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 3
          # the kubelet stops liveness probes once the pod is terminating, so a draining 503 never kills a call;
          # a Postgres outage restarts the pod only after 2 minutes
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 6
          lifecycle:
            preStop:
              sleep: {seconds: 10}
          resources:
            requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 256Mi}
            limits: {cpu: "1", memory: 256Mi, ephemeral-storage: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /etc/jarvis, readOnly: true}
            - {name: sandbox-cluster, mountPath: /var/run/secrets/jarvis/sandbox-cluster, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
        - name: config
          projected:
            sources:
              - configMap:
                  name: jarvis-config
                  items: [{key: config.json, path: config.json}, {key: system-prompt.md, path: system-prompt.md}]
        - name: sandbox-cluster
          secret: {secretName: sandbox-cluster, optional: true, defaultMode: 0400}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: jarvis
spec:
  selector: {app: web}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: jarvis
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: web}
