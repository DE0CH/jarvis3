# Generated by jarvis3 infra/instance.py scaffold from instance.json; re-run it after editing that file.
# Flux applies this directory (flux/sync.yaml) as the limited flux-applier identity, decrypting the SOPS
# file with the box's age key.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jarvis3
resources:
  - ../../base
  - secrets.enc.yaml
configMapGenerator:
  - name: jarvis-config
    files: [config.json]
  - name: jarvis-instance
    envs: [instance.env]
images:
  - name: ghcr.io/de0ch/jarvis3-server
    newTag: "main"
commonAnnotations:
  jarvis3/secrets-rev: "f19b27431d8a"
