# Generated by jarvis3 infra/instance.py scaffold. Applied ONCE by the box's cloud-init (not reconciled),
# so a push to the instance repo can never make a namespace or grant a right: per extra app, its namespace
# (Pod Security "restricted") and the identity Flux applies it as (admin in that namespace only).
# Adding an app to an existing box means rebuilding the box (docs/RUNBOOK.md).
apiVersion: v1
kind: Namespace
metadata:
  name: app-hello
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: flux-app-hello, namespace: flux-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: flux-app-hello, namespace: app-hello }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects: [{ kind: ServiceAccount, name: flux-app-hello, namespace: flux-system }]
