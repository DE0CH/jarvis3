# Generated by jarvis3 infra/instance.py scaffold. Applied ONCE by the box's cloud-init (not reconciled):
# Flux pulls the instance repo with its read-only deploy key (Secret instance-repo) and applies ./deploy as
# flux-applier (admin in the jarvis3 namespace only), decrypting SOPS files with the box's age key.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: { name: instance, namespace: flux-system }
spec:
  interval: 1m
  url: ssh://git@github.com/example-org/example-jarvis.git
  ref: { branch: main }
  secretRef: { name: instance-repo }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: instance, namespace: flux-system }
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  sourceRef: { kind: GitRepository, name: instance }
  path: ./deploy
  prune: true
  wait: false
  serviceAccountName: flux-applier
  decryption:
    provider: sops
    secretRef: { name: sops-age }
---
# the extra app "hello": applied as flux-app-hello, which can touch app-hello only
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: app-hello, namespace: flux-system }
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  sourceRef: { kind: GitRepository, name: instance }
  path: ./apps/hello
  targetNamespace: app-hello
  prune: true
  wait: false
  serviceAccountName: flux-app-hello
  decryption:
    provider: sops
    secretRef: { name: sops-age }
