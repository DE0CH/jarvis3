# The instance server: exactly one replica (session channels live in its memory), Recreate so two never
# overlap on the SQLite file. Init containers restore the database from the bucket when the volume is
# empty (a rebuilt box) and clone the org-env mirror; sidecars keep replicating and fetching.
# Every container runs as uid/gid 1000 (the server image's user) under Pod Security "restricted".
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: data }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: server }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels: { app: server }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: server } }
  template:
    metadata: { labels: { app: server } }
    spec:
      serviceAccountName: server
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: restore
          image: litestream/litestream:0.5.17-scratch@sha256:f757c70d070ac278d45b8847d31a54ab2de24de5e77b09018c642eca263e3967
          args: [restore, -config, /etc/litestream/litestream.yml, -if-db-not-exists, -if-replica-exists, /data/jarvis.db]
          envFrom: [{ configMapRef: { name: jarvis-instance } }]
          env: &s3creds
            - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: jarvis-secrets, key: S3_ACCESS_KEY_ID } } }
            - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: jarvis-secrets, key: S3_SECRET_ACCESS_KEY } } }
            - { name: TMPDIR, value: /tmp }
          volumeMounts: &lsmounts
            - { name: data, mountPath: /data }
            - { name: litestream, mountPath: /etc/litestream, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 256Mi } }
        - name: org-env
          image: alpine/git:v2.54.0@sha256:a4bb51f1a3553df194ce679fc1db721d8bfba2046fa1a88fe9d4ac551ffbce25
          command: [sh, /scripts/org-env-sync.sh, once]
          envFrom: [{ configMapRef: { name: jarvis-instance } }]
          volumeMounts: &gitmounts
            - { name: data, mountPath: /data }
            - { name: org-env-sync, mountPath: /scripts, readOnly: true }
            - { name: org-env-key, mountPath: /etc/org-env-key, readOnly: true }
            - { name: known-hosts, mountPath: /etc/known-hosts, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext: *restricted
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 512Mi } }
      containers:
        - name: server
          image: jarvis3-server
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: JARVIS_CONFIG, value: /etc/jarvis/config.json }
            - { name: JARVIS_DB, value: /data/jarvis.db }
            - { name: PORT, value: "8080" }
          envFrom: [{ secretRef: { name: jarvis-secrets } }]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /etc/jarvis, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 4
          securityContext: *restricted
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
        - name: litestream
          image: litestream/litestream:0.5.17-scratch@sha256:f757c70d070ac278d45b8847d31a54ab2de24de5e77b09018c642eca263e3967
          args: [replicate, -config, /etc/litestream/litestream.yml]
          envFrom: [{ configMapRef: { name: jarvis-instance } }]
          env: *s3creds
          volumeMounts: *lsmounts
          securityContext: *restricted
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 256Mi } }
        - name: org-env-fetch
          image: alpine/git:v2.54.0@sha256:a4bb51f1a3553df194ce679fc1db721d8bfba2046fa1a88fe9d4ac551ffbce25
          command: [sh, /scripts/org-env-sync.sh, loop]
          envFrom: [{ configMapRef: { name: jarvis-instance } }]
          volumeMounts: *gitmounts
          securityContext: *restricted
          resources: { requests: { cpu: 5m, memory: 16Mi }, limits: { memory: 512Mi } }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: data } }
        - { name: config, configMap: { name: jarvis-config } }
        - { name: litestream, configMap: { name: litestream } }
        - { name: org-env-sync, configMap: { name: org-env-sync } }
        - { name: known-hosts, configMap: { name: github-known-hosts } }
        - { name: org-env-key, secret: { secretName: org-env-deploy-key, defaultMode: 0440, optional: true } }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: server }
spec:
  selector: { app: server }
  ports: [{ name: http, port: 8080, targetPort: http }]
