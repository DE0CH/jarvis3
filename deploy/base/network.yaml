# Nothing in the namespace accepts connections except the server, and only from cloudflared (the
# tunnel). Egress stays open (the server talks to Fly, OpenRouter, Google, Cloudflare and S3; session
# machines dial in through the tunnel) except the cloud metadata service, which keeps serving the box's
# user-data (it carries the age key and the instance repo's deploy key).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: server-from-tunnel }
spec:
  podSelector: { matchLabels: { app: server } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: cloudflared } } }]
      ports: [{ port: 8080, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: no-metadata-service }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 0.0.0.0/0, except: [169.254.169.254/32] } }]
    - to: [{ ipBlock: { cidr: "::/0" } }]
