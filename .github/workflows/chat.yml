name: chat
# The chat runtime (docs/CHAT.md): typecheck and tests against a real Postgres; egress, the image under test, against
# aviary's gateway and model conformance suites (aviary platform spec 17.3; the aviary commit in chat/aviary.ref); then
# the images ghcr.io/de0ch/jarvis3-chat (web, egress, tools; linux/amd64 and linux/arm64) and ghcr.io/de0ch/jarvis3-sandbox
# (Claude Code and the sandbox agent), smoke-tested, pushed on main as :<commit 12> and on a chat-v* tag as :<tag> too, only when the tests
# and both suites pass. The chat image is built once (job chat-image, one build time) and that same image, passed on as
# an artifact, is what conformance checks and images smoke-tests and pushes (the pushed image id is checked against
# the built one);
# and the same sandbox as the E2B template jarvis3-sandbox:<commit 12> (the "e2b" sandbox provider), smoke-tested in a
# real E2B sandbox (secret E2B_API_KEY: the instance's E2B project; skipped without it).
on:
  push:
    branches: [main]
    paths: ["chat/**", ".github/workflows/chat.yml"]
    tags: ["chat-v*"]
  pull_request:
    paths: ["chat/**", ".github/workflows/chat.yml"]
  workflow_dispatch:

concurrency:
  group: chat-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CHAT_IMAGE: ghcr.io/de0ch/jarvis3-chat
  SANDBOX_IMAGE: ghcr.io/de0ch/jarvis3-sandbox

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: claude
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claude" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://claude:dev@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chat/package-lock.json
      - name: the catalogue cases are hermit's
        # tools validates the staff catalogue by hermit's rules (src/tools/catalogue.ts); the shared cases are a
        # byte-for-byte copy of aviary's, so a change to hermit's rules turns this red until tools follows
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/DE0CH/aviary/main/crates/hermit/fixtures/catalogue-cases.json \
            | cmp - chat/test/fixtures/catalogue-cases.json
      - name: typecheck and tests
        working-directory: chat
        # egress's mirror test runs the real pip and npm (python3 -m pip is on the runner image)
        run: |
          python3 -m pip --version
          npm ci
          npm test

  chat-image:
    # the chat image, built once: conformance checks it and images pushes it, so what ships is what was tested
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      id: ${{ steps.load.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: build time
        id: built
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: build the chat image
        uses: docker/build-push-action@v6
        with:
          context: chat
          tags: jarvis3-chat:test
          outputs: type=docker,dest=${{ runner.temp }}/chat-image.tar
          build-args: |
            CHAT_COMMIT=${{ github.sha }}
            CHAT_BUILT_AT=${{ steps.built.outputs.at }}
          cache-from: type=gha,scope=chat-image
          cache-to: type=gha,mode=max,scope=chat-image
      - name: image id
        id: load
        run: |
          set -euo pipefail
          docker load -q -i "$RUNNER_TEMP/chat-image.tar"
          id=$(docker image inspect jarvis3-chat:test --format '{{.Id}}')
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "chat image $id (built ${{ steps.built.outputs.at }})" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: chat-image
          path: ${{ runner.temp }}/chat-image.tar
          retention-days: 1
          compression-level: 1

  conformance:
    # egress as a sandbox gateway, checked from outside (aviary platform spec 8.2, 8.3, 17.3): the chat image built
    # once (job chat-image) with test configs (chat/test/conformance/), the suites' fakes at the fixed names, the drain
    # last. The suites are aviary's published testing image at the commit chat/aviary.ref names (bumped when the
    # gateway contract changes, to an aviary commit that has a release).
    runs-on: ubuntu-latest
    needs: [chat-image]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: aviary's testing image at chat/aviary.ref (aviary-conformance and mock-model)
        # ghcr.io/de0ch/aviary-testing:<sha12> exists only for aviary commits that passed aviary's own gates (its
        # publish job); the suites run as the image's binaries, unchanged on this runner
        run: |
          set -euo pipefail
          ref=$(tr -d ' \n' < chat/aviary.ref)
          image=ghcr.io/de0ch/aviary-testing:${ref:0:12}
          docker pull -q "$image"
          id=$(docker create "$image" aviary-conformance)  # the image has no default command
          mkdir -p conformance-bin
          docker cp "$id:/usr/local/bin/aviary-conformance" conformance-bin/
          docker cp "$id:/usr/local/bin/mock-model" conformance-bin/
          docker rm "$id" >/dev/null
          echo "aviary-testing $image ($(docker image inspect -f '{{index .RepoDigests 0}}' "$image"))" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: chat-image
          path: ${{ runner.temp }}
      - name: load the chat image under test
        run: |
          set -euo pipefail
          docker load -q -i "$RUNNER_TEMP/chat-image.tar"
          test "$(docker image inspect jarvis3-chat:test --format '{{.Id}}')" = "${{ needs.chat-image.outputs.id }}"
      - name: aviary-conformance gateway and model
        run: chat/test/conformance/run.sh jarvis3-chat:test conformance-bin "$RUNNER_TEMP/conformance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance
          path: ${{ runner.temp }}/conformance

  chat-image-arm64:
    # the chat image for linux/arm64 (the new YYC cluster's workers are ARM), built natively on an ARM runner from the
    # same commit and smoke-tested there; images pushes it beside the amd64 image under one multi-platform tag. The
    # code is plain JavaScript (no native modules), so conformance on amd64 covers it
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the arm64 chat image
        uses: docker/build-push-action@v6
        with:
          context: chat
          platforms: linux/arm64
          tags: jarvis3-chat:test-arm64
          outputs: type=docker,dest=${{ runner.temp }}/chat-image-arm64.tar
          build-args: |
            CHAT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=chat-image-arm64
          cache-to: type=gha,mode=max,scope=chat-image-arm64
      - name: smoke test
        run: |
          set -euo pipefail
          docker load -q -i "$RUNNER_TEMP/chat-image-arm64.tar"
          test "$(docker image inspect jarvis3-chat:test-arm64 --format '{{.Architecture}}')" = arm64
          docker run --rm --entrypoint sh jarvis3-chat:test-arm64 -c 'test "$(id -u)" = 1000 && test -s egress-allowlist/allow.txt && node -e "require(\"pg\"); require(\"ws\")"'
          if docker run --rm jarvis3-chat:test-arm64 nope; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: chat-image-arm64
          path: ${{ runner.temp }}/chat-image-arm64.tar
          retention-days: 1
          compression-level: 1

  images:
    runs-on: ubuntu-latest
    needs: [test, chat-image, chat-image-arm64, conformance]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: tags
        id: tags
        run: |
          set -euo pipefail
          short=${GITHUB_SHA::12}
          chat="$CHAT_IMAGE:$short"
          sandbox="$SANDBOX_IMAGE:$short"
          if [[ $GITHUB_REF == refs/tags/chat-v* ]]; then
            chat="$chat,$CHAT_IMAGE:${GITHUB_REF_NAME}"
            sandbox="$sandbox,$SANDBOX_IMAGE:${GITHUB_REF_NAME}"
          fi
          echo "chat=$chat" >> "$GITHUB_OUTPUT"
          echo "sandbox=$sandbox" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: build the sandbox image
        uses: docker/build-push-action@v6
        with:
          context: chat/sandbox
          load: true
          tags: jarvis3-sandbox:test
          cache-from: type=gha,scope=sandbox-image
          cache-to: type=gha,mode=max,scope=sandbox-image
      - uses: actions/download-artifact@v4
        with:
          name: chat-image
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          name: chat-image-arm64
          path: ${{ runner.temp }}/arm64
      - name: load the chat image conformance checked
        run: |
          set -euo pipefail
          docker load -q -i "$RUNNER_TEMP/chat-image.tar"
          test "$(docker image inspect jarvis3-chat:test --format '{{.Id}}')" = "${{ needs.chat-image.outputs.id }}"
      - name: smoke test
        run: |
          set -euo pipefail
          for i in jarvis3-chat:test jarvis3-sandbox:test; do
            docker image inspect $i --format '{{.Size}}' | awk -v i=$i '{printf "%s unpacked: %.0f MB\n", i, $1/1e6}' | tee -a "$GITHUB_STEP_SUMMARY"
          done
          docker run --rm --entrypoint sh jarvis3-chat:test -c 'test "$(id -u)" = 1000 && test -s egress-allowlist/allow.txt'
          # an unknown role refuses to start (the role is the first argument)
          if docker run --rm jarvis3-chat:test nope; then exit 1; fi
          # the sandbox agent answers its health check; Claude Code and the Python tools are in the image
          docker run -d --name sbx -e JARVIS_EXEC_TOKEN=t -p 17070:7070 jarvis3-sandbox:test
          for i in $(seq 30); do curl -fsS localhost:17070/healthz && break; sleep 1; done
          curl -fsS -H 'x-jarvis-exec-token: t' localhost:17070/healthz | jq -e '.ok == true'
          docker rm -f sbx
          docker run --rm --entrypoint sh jarvis3-sandbox:test -c 'claude --version && python3 -c "import pandas" && test "$(id -u)" = 1000 && test -d /workspace'
          # Docker is in the image; outside our own hosts (no sbx-init) the wrapper says it isn't available
          docker run --rm --entrypoint sh jarvis3-sandbox:test -c 'test -x /usr/bin/dockerd && test -x /usr/bin/containerd && test -f /opt/agent/sbx-init.mjs && setpriv --version >/dev/null && out=$(docker ps 2>&1); echo "$out" | grep -q "not available"'
          # installing packages (docs/SANDBOX-VM.md "Installing packages"): sudo is set up for uid 1000 and keeps the
          # proxy variables; apt-get/apt are the wrappers; apt asks nothing
          docker run --rm --user 0 --entrypoint sh jarvis3-sandbox:test -c 'test "$(command -v apt-get)" = /usr/local/bin/apt-get && test -u /usr/bin/sudo && sudo -n -l -U node | grep -q "NOPASSWD: ALL" && sudo -n -l -U node | grep -q HTTPS_PROXY && apt-config dump | grep -q "Assume-Yes \"true\"" && echo $PATH | grep -q /home/sandbox/.local/bin'
          # uid 1000, as a command runs: apt-get goes through sudo and fetches the package lists itself
          docker run --rm --entrypoint sh jarvis3-sandbox:test -c 'test "$(id -u)" = 1000 && apt-get install -y -qq sl >/dev/null && test -x /usr/games/sl'
          # without root (kubernetes/e2b style, no sudo): a clear message, not a prompt
          out=$(docker run --rm --security-opt no-new-privileges --entrypoint sh jarvis3-sandbox:test -c 'apt-get install -y jq 2>&1; echo "exit $?"') ; echo "$out"; echo "$out" | grep -q "needs root" && echo "$out" | grep -q "exit 100"
          # (sandboxd is the Rust daemon since 570eeac, built and tested by its own workflow; no Node sources to load here)
      - name: log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push the chat image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # the very image chat-image built and conformance checked, retagged (no rebuild), as :<tag>-amd64; the
          # arm64 image of chat-image-arm64 as :<tag>-arm64; :<tag> is the two as one multi-platform index
          docker load -q -i "$RUNNER_TEMP/arm64/chat-image-arm64.tar"
          IFS=, read -ra tags <<< "${{ steps.tags.outputs.chat }}"
          for t in "${tags[@]}"; do
            docker tag jarvis3-chat:test "$t-amd64"
            docker push -q "$t-amd64"
            docker tag jarvis3-chat:test-arm64 "$t-arm64"
            docker push -q "$t-arm64"
            docker buildx imagetools create -t "$t" "$t-amd64" "$t-arm64"
          done
          test "$(docker image inspect "${tags[0]}-amd64" --format '{{.Id}}')" = "${{ needs.chat-image.outputs.id }}"
          amd64=$(docker image inspect "${tags[0]}-amd64" --format '{{index .RepoDigests 0}}')
          # the index's amd64 entry is the pushed tested image
          docker buildx imagetools inspect "${tags[0]}" --raw \
            | jq -e --arg d "${amd64#*@}" 'any(.manifests[]; .platform.architecture == "amd64" and .digest == $d)' >/dev/null
          echo "chat image ${{ needs.chat-image.outputs.id }} = $amd64 (amd64), index ${tags[0]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: push the sandbox image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # the very image the smoke test ran, retagged (no rebuild)
          id=$(docker image inspect jarvis3-sandbox:test --format '{{.Id}}')
          IFS=, read -ra tags <<< "${{ steps.tags.outputs.sandbox }}"
          for t in "${tags[@]}"; do
            docker tag jarvis3-sandbox:test "$t"
            docker push -q "$t"
          done
          test "$(docker image inspect "${tags[0]}" --format '{{.Id}}')" = "$id"
          echo "sandbox image $id = $(docker image inspect "${tags[0]}" --format '{{index .RepoDigests 0}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: summary
        if: github.event_name != 'pull_request'
        run: |
          echo "pushed ${{ steps.tags.outputs.chat }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "pushed ${{ steps.tags.outputs.sandbox }}" | tee -a "$GITHUB_STEP_SUMMARY"

  e2b-template:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name != 'pull_request'
    timeout-minutes: 40
    env:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: build the E2B template jarvis3-sandbox:<commit 12> and smoke-test it
        run: |
          set -euo pipefail
          if [ -z "$E2B_API_KEY" ]; then echo "no E2B_API_KEY secret: E2B template skipped" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/e2b" && cp chat/sandbox/e2b-template.mjs "$RUNNER_TEMP/e2b/"
          cd "$RUNNER_TEMP/e2b" && npm init -y >/dev/null && npm i --no-audit --no-fund e2b@2.56.0
          node e2b-template.mjs "$GITHUB_WORKSPACE/chat/sandbox" "${GITHUB_SHA::12}" --smoke | tee build.log
          if [[ $GITHUB_REF == refs/tags/chat-v* ]]; then node e2b-template.mjs "$GITHUB_WORKSPACE/chat/sandbox" "$GITHUB_REF_NAME"; fi
          echo "E2B template jarvis3-sandbox:${GITHUB_SHA::12}: $(grep templateId build.log | head -1)" | tee -a "$GITHUB_STEP_SUMMARY"
