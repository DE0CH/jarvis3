name: chat
# The chat runtime (docs/CHAT.md): typecheck and tests against a real Postgres, the UI typecheck and build, then the
# images ghcr.io/de0ch/jarvis3-chat (web, egress, tools + UI + claw pinned in chat/claw.json) and
# ghcr.io/de0ch/jarvis3-sandbox, smoke-tested, pushed on main as :<commit 12> and on a chat-v* tag as :<tag> too.
on:
  push:
    branches: [main]
    paths: ["chat/**", ".github/workflows/chat.yml"]
    tags: ["chat-v*"]
  pull_request:
    paths: ["chat/**", ".github/workflows/chat.yml"]
  workflow_dispatch:

concurrency:
  group: chat-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CHAT_IMAGE: ghcr.io/de0ch/jarvis3-chat
  SANDBOX_IMAGE: ghcr.io/de0ch/jarvis3-sandbox

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: claude
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claude" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://claude:dev@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chat/package-lock.json
      - name: server side
        working-directory: chat
        run: |
          npm ci
          npm test
      - name: UI
        working-directory: chat/ui
        run: |
          npm ci
          npm run typecheck
          npm run build
          test -s ../ui-dist/index.html

  images:
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: tags
        id: tags
        run: |
          set -euo pipefail
          short=${GITHUB_SHA::12}
          chat="$CHAT_IMAGE:$short"
          sandbox="$SANDBOX_IMAGE:$short"
          if [[ $GITHUB_REF == refs/tags/chat-v* ]]; then
            chat="$chat,$CHAT_IMAGE:${GITHUB_REF_NAME}"
            sandbox="$sandbox,$SANDBOX_IMAGE:${GITHUB_REF_NAME}"
          fi
          echo "chat=$chat" >> "$GITHUB_OUTPUT"
          echo "sandbox=$sandbox" >> "$GITHUB_OUTPUT"
          echo "claw_url=$(jq -r .url chat/claw.json)" >> "$GITHUB_OUTPUT"
          echo "claw_sha=$(jq -r .sha256 chat/claw.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: build the chat image
        uses: docker/build-push-action@v6
        with:
          context: chat
          load: true
          tags: jarvis3-chat:test
          build-args: |
            CLAW_URL=${{ steps.tags.outputs.claw_url }}
            CLAW_SHA256=${{ steps.tags.outputs.claw_sha }}
            CHAT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=chat-image
          cache-to: type=gha,mode=max,scope=chat-image
      - name: build the sandbox image
        uses: docker/build-push-action@v6
        with:
          context: chat/sandbox
          load: true
          tags: jarvis3-sandbox:test
          cache-from: type=gha,scope=sandbox-image
          cache-to: type=gha,mode=max,scope=sandbox-image
      - name: smoke test
        run: |
          set -euo pipefail
          for i in jarvis3-chat:test jarvis3-sandbox:test; do
            docker image inspect $i --format '{{.Size}}' | awk -v i=$i '{printf "%s unpacked: %.0f MB\n", i, $1/1e6}' | tee -a "$GITHUB_STEP_SUMMARY"
          done
          docker run --rm --entrypoint sh jarvis3-chat:test -c 'test "$(id -u)" = 1000 && test -s /app/ui-dist/index.html && /usr/local/bin/claw --version && test -x src/bin/jarvis-bash && test -x src/bin/jarvis-mcp-bridge'
          # an unknown role refuses to start
          if docker run --rm -e JARVIS_ROLE=nope jarvis3-chat:test; then exit 1; fi
          # the sandbox agent answers its health check
          docker run -d --name sbx -e JARVIS_EXEC_TOKEN=t -p 17070:7070 jarvis3-sandbox:test
          for i in $(seq 30); do curl -fsS localhost:17070/healthz && break; sleep 1; done
          curl -fsS -H 'authorization: Bearer t' -H 'content-type: application/json' -d '{"command":"python3 -c \"import pandas; print(1)\" && id -u"}' localhost:17070/exec | tee /dev/stderr | jq -e '.exit_code == 0'
          docker rm -f sbx
      - name: log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push the chat image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: chat
          push: true
          tags: ${{ steps.tags.outputs.chat }}
          build-args: |
            CLAW_URL=${{ steps.tags.outputs.claw_url }}
            CLAW_SHA256=${{ steps.tags.outputs.claw_sha }}
            CHAT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=chat-image
      - name: push the sandbox image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: chat/sandbox
          push: true
          tags: ${{ steps.tags.outputs.sandbox }}
          cache-from: type=gha,scope=sandbox-image
      - name: summary
        if: github.event_name != 'pull_request'
        run: |
          echo "pushed ${{ steps.tags.outputs.chat }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "pushed ${{ steps.tags.outputs.sandbox }}" | tee -a "$GITHUB_STEP_SUMMARY"
