name: deploy
# The deployment of one instance (docs/DEPLOY.md): the infra scripts' tests (dry runs, fake APIs, a real
# SOPS round trip), the manifests rendered and schema-checked, and a smoke test of the base on a k3d
# cluster with the server image built from this commit. Nothing here touches a real cloud account.
on:
  push:
    paths: ["deploy/**", "infra/**", "server/**", ".github/workflows/deploy.yml"]
  pull_request:
    paths: ["deploy/**", "infra/**", "server/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  SOPS_VERSION: v3.13.3
  AGE_VERSION: v1.2.1
  KUBECONFORM_VERSION: v0.8.0
  K3D_VERSION: v5.9.0

jobs:
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: sops and age
        run: |
          curl -fsSL -o /usr/local/bin/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          chmod +x /usr/local/bin/sops
          curl -fsSL "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz" | sudo tar xz -C /usr/local/bin --strip-components=1 age/age age/age-keygen
          sops --version && age --version
      - name: scripts parse
        run: |
          bash -n infra/cloud-init.sh
          bash -n deploy/smoke/run.sh
          sh -n deploy/base/org-env-sync.sh
          python3 -m py_compile infra/instance.py
      - name: unit tests
        run: python3 -m unittest discover -s infra/tests -v
      - name: dry runs print no secret
        env:
          GOOGLE_IDP_CLIENT_SECRET: canary-idp-secret
          JARVIS_DB_KEY: canary-db-key
        run: |
          set -euo pipefail
          E=deploy/example-instance
          out=$( { python3 infra/instance.py check $E
                   python3 infra/instance.py cloudflare $E --out "$RUNNER_TEMP/cf.env"
                   python3 infra/instance.py box $E --age-key $E/TEST-ONLY-age.key --flux-key /dev/null
                   python3 infra/instance.py deploy-keys $E --out-dir "$RUNNER_TEMP/keys"; } 2>&1 )
          echo "$out"
          if grep -q -e canary -e AGE-SECRET-KEY <<<"$out"; then echo "a secret was printed"; exit 1; fi

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | sudo tar xz -C /usr/local/bin kubeconform
          curl -fsSL -o /usr/local/bin/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          chmod +x /usr/local/bin/sops
      - name: render
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r"
          kubectl kustomize deploy/bootstrap > "$RUNNER_TEMP/r/bootstrap.yaml"
          kubectl kustomize deploy/base > "$RUNNER_TEMP/r/base.yaml"
          kubectl kustomize deploy/smoke > "$RUNNER_TEMP/r/smoke.yaml"
          # the example instance as Flux would see it: its SOPS file decrypted (test-only key) first
          cp -r deploy "$RUNNER_TEMP/deploy"
          E="$RUNNER_TEMP/deploy/example-instance"
          SOPS_AGE_KEY_FILE=deploy/example-instance/TEST-ONLY-age.key sops -d -i "$E/deploy/secrets.enc.yaml"
          kubectl kustomize "$E/deploy" > "$RUNNER_TEMP/r/example.yaml"
          cp deploy/example-instance/flux/sync.yaml "$RUNNER_TEMP/r/flux-sync.yaml"
          # what Flux prunes if a commit drops it: both Deployments and the PVC must be there
          deps="$(awk '/^kind: Deployment/{f=1} f&&/^  name:/{print $2;f=0}' "$RUNNER_TEMP/r/example.yaml" | sort | tr '\n' ' ')"
          [ "$deps" = "cloudflared server " ] || { echo "Deployments: $deps"; exit 1; }
          grep -q 'kind: PersistentVolumeClaim' "$RUNNER_TEMP/r/example.yaml"
          grep -q 'image: ghcr.io/de0ch/jarvis3-server:main' "$RUNNER_TEMP/r/example.yaml"
          if grep -n 'image: [^@]*:latest' "$RUNNER_TEMP/r/example.yaml"; then echo "unpinned image"; exit 1; fi
      - name: kubeconform
        run: |
          kubeconform -strict -summary -kubernetes-version 1.34.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$RUNNER_TEMP"/r/*.yaml

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [manifests]
    steps:
      - uses: actions/checkout@v4
      - name: k3d
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=${K3D_VERSION} bash
      - name: smoke test
        run: timeout 900 deploy/smoke/run.sh
